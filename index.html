<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" href="style.css">

	<title>TypeAura</title>
</head>

<body>
	<header>
		<div>
			<h1>TypeAura</h1>
		</div>
	</header>

	<section>
		<h2>Type fast. Type smart. Type better.</h2>
		<p>Practice today, become a pro tomorrow.</p>
	</section>

	<section>
		<h3>Select Difficulty</h3>

		<button type="button">Easy</button>
		<button type="button">Medium</button>
		<button type="button">Difficult</button>
	</section>

	<section>
		<h3>Select Time</h3>

		<button type="button">30 sec</button>
		<button type="button">60 sec</button>
		<button type="button">90 sec</button>
		<button type="button">120 sec</button>
	</section>

	<button type="button">Start Test →</button>

</html>
