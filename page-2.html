<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TypeAura</title>

	<link rel="stylesheet" href="style_2.css">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
</head>

<body>
	<header>
		<div class="logo">
			<h1>Type<i>Aura</i></h1>
		</div>
	</header>
	<div class="top-2">
		<div class="clock-wrapper">
			<svg height="170" width="170" class="ring">
				<circle r="75" cx="85" cy="85" fill="black" stroke="#c39ffe" stroke-width="15"></circle>
			</svg>
			<div class="progress"></div>
		</div>
		<div class="timing">30</div>
		<div>
			<button id="toggle-button">
				<img src="/Typing-Test/assets/pause_button.png" alt="pause" id="togg">
			</button>

		</div>
	</div>

	<div id="pop-up">
		<div class="popup-box">
			<h2>Your typing speed</h2>
			<div id="user_typing_details">
				<div class="details">
					<p>WPM :<span id="wpm">0</span></p>
					<p>Accuracy :<span id="accuracy">0</span>%</p>
					<p>CPM :<span id="cpm">0</span></p>
				</div>
				<div>
					<img id="animal-img" src="" alt="img">
				</div>
			</div>
			<p>Your typing speed was like a <span id="animal"></span></p>
			<p id="message"></p>

			<button id="restart-btn">
				Restart
			</button>
		</div>
	</div>

	<div class="typing-area" id="typing-area">
		<p id="text_area">The quick brown fox jumps over the lazy dog</p>
	</div>

	<input id="input-box" autocomplete="off" autofocus>

	<script src="page_2.js"></script>
</body>

</html>
